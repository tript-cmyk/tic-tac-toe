<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tic Tac Toe</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>
    <main class="game">
      <header class="game__header">
        <h1 class="game__title">Tic Tac Toe</h1>
        <p id="game-status" class="game__status game__status--x">
          Turn of Player X
        </p>
      </header>

      <section class="settings-panel">
        <div class="settings-panel__row">
          <label for="game-mode-select" class="settings-panel__label"
            >Game Mode</label
          >
          <select id="game-mode-select" class="select-control">
            <option value="3x3" selected>Tic Tac Toe (3x3 - 3 to win)</option>
            <option value="10x10">Standard Caro (10x10 - 5 to win)</option>
            <option value="custom">Custom Mode</option>
          </select>
        </div>

        <div id="custom-settings" class="custom-settings hidden">
          <div class="settings-panel__row">
            <label for="custom-board-size" class="settings-panel__label"
              >Board Size (N x N) [3-20]</label
            >
            <input
              type="number"
              id="custom-board-size"
              min="3"
              max="20"
              value="3"
              class="input-control"
            />
          </div>
          <div class="settings-panel__row">
            <label for="custom-win-length" id="custom-win-length-label" class="settings-panel__label"
              >Win Length [3 or 5]</label
            >
            <input
              type="number"
              id="custom-win-length"
              step="2"
              min="3"
              max="5"
              value="3"
              class="input-control"
            />
          </div>
        </div>
      </section>

      <section class="scoreboard">
        <div class="score score--x">
          <span class="score__label">Player X</span>
          <span id="score-x" class="score__value">0</span>
        </div>

        <div class="score score--draw">
          <span class="score__label">Draws</span>
          <span id="score-draw" class="score__value">0</span>
        </div>

        <div class="score score--o">
          <span class="score__label">Player O</span>
          <span id="score-o" class="score__value">0</span>
        </div>
      </section>

      <section id="game-board" class="board">
        <!-- <button class="cell" data-index="0" aria-label="Cell 1"></button> -->
      </section>

      <div class="game__actions">
        <button id="new-game-button" class="button">New game</button>
        <button id="reset-game-button" class="button button__secondary">
          Reset Game
        </button>
      </div>
    </main>

    <script type="module" src="./js/main.js"></script>
  </body>
</html>
